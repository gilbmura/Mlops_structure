# Load balancer in front of the API replicas (docker compose --scale api=N).
# Open-source nginx resolves "api" once at start-up, so restart the gateway after
# changing the replica count (loadtest/run_scaling.py does this).
events {}

http {
    log_format upstream '$remote_addr "$request" $status $request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream;

    client_max_body_size 110m;   # uploads are limited to 100 MiB by the API as well

    upstream api_pool {
        least_conn;               # send each request to the replica with fewest in-flight requests
        server api:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8000;
        location / {
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout http_502;
        }
    }
}
